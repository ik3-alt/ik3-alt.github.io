</head>
<body id="contact">
	<header id="header">
		<h1>
			<a href="index.html">
				<img src="images/logo-sp.svg" class="sp-only" alt="TOP | IK Design Portfolio">
				<img src="images/logo-pc.svg" class="pc-only" alt="TOP | IK Design Portfolio">
			</a>
		</h1>
	</header>
	<div id="nav-bg"></div>
	<nav id="nav">
		<ul>
			<li><a href="index.html">TOP</a></li>
			<li><a href="about.html">ABOUT</a></li>
			<li><a href="works.html">WORKS</a></li>
			<li><a href="contact.html">CONTACT</a></li>
		</ul>
	</nav>
	<div class="nav-btn-outer">
		<div id="nav-btn">
			<div class="line line1"></div>
			<div class="line line2"></div>
			<div class="line line3"></div>
		</div>
	</div>
	<main id="main" class="main-wrapper">
		<h1 class="page-title">
			<span class="en">CONTACT</span>
			<span class="ja">お問い合わせ</span>
		</h1>
		<section id="form" class="content-wrapper">
			<h2 class="section-title"><span class="en">Form</span><span class="ja">お問い合わせフォーム</span></h2>
			<p>作品や制作に関するお問い合わせ、ご質問などがございましたら、下記フォームよりお気軽にお問い合わせください。</p>
			<p class="section-start">ご入力いただいた個人情報は、お問い合わせへの回答および必要なご連絡のために利用し、それ以外の目的では利用いたしません。</p>
			<form action="#" method="post">
				<dl>
					<dt><label for="name">お名前（必須）</label></dt>
					<dd><input type="text" id="name" name="name" required></dd>
					<dt><label for="mail">メールアドレス（必須）</label></dt>
					<dd><input type="email" id="mail" name="mail" required></dd>
					<dt><label for="phone">電話番号（任意）</label></dt>
					<dd><input type="tel" id="phone" name="phone"></dd>
					<dt><label for="message">お問い合わせ内容（必須）</label></dt>
					<dd><textarea name="message" id="message" required></textarea></dd>
				</dl>
				<button type="submit">送信</button>
			</form>
		</section>
	</main>
	<footer id="footer">
		<p class="small">&copy; 2026 IK All Rights Reserved.</p>
	</footer>
